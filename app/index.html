<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./index.css">
    <script defer src="./index.js"></script>
    <title>T-PageCode Phishing Check</title>
</head>
<body>
    <div id="app">
        <div id="title-bar">
            <img id="title-image" src="../icon/icon.ico">
            <h1 id="title">T-PageCode Phishing Check</h1>
            <button id="close-button">
                <p>X</p>
            </button>
            <button id="min-button">
                <p>-</p>
            </button>
        </div>
        <h1 id="main-text">T-PageCode Phishing Check</h1>
        <p id="phishing-check">钓鱼网站检测</p>
        <input placeholder="输入网站名称" id="input-site" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off">
        <h3 id="phishing-info"></h3>
        <div id="warning">注意：请不要输入http://、https://和www.或者/XXX，否则会导致恶意网址库不匹配。</div>
    </div>
</body>
</html>
